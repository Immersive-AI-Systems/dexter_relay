[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-relay"
version = "0.1.0"
description = "UDP force-vector relay for Dexter load-cell measurements."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Immersive AI Systems" }
]
dependencies = []

[project.optional-dependencies]
server = [
  "dexter-controller",
]

[project.scripts]
dexter-relay-server = "dexter_relay.server:main"
dexter-relay-client = "dexter_relay.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.environments]
default = { features = ["server"], solve-group = "server" }
client = { features = ["client"], solve-group = "client" }

[tool.pixi.feature.server]
platforms = ["win-64"]

[tool.pixi.feature.server.dependencies]
python = "3.13.*"

[tool.pixi.feature.server.pypi-dependencies]
dexter-relay = { path = ".", editable = true }
dexter-controller = { path = "../dexter-controller/python/dexter-controller", editable = true }

[tool.pixi.feature.client]
platforms = ["linux-64", "win-64"]

[tool.pixi.feature.client.dependencies]
python = "3.13.*"

[tool.pixi.feature.client.pypi-dependencies]
dexter-relay = { path = ".", editable = true }

[tool.pixi.feature.client.tasks]
run-client = "python -m dexter_relay.client"
