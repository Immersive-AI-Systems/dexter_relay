[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-relay"
version = "0.1.0"
description = "UDP force-vector relay for Dexter load-cell measurements."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Immersive AI Systems" }
]
dependencies = []

[project.optional-dependencies]
server = [
  "dexter-controller",
]

[project.scripts]
dexter-relay-server = "dexter_relay.server:main"
dexter-relay-client = "dexter_relay.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
dexter-relay = { path = ".", editable = true }

[tool.pixi.target.win-64.pypi-dependencies]
dexter-controller = ">=0.2.2"

[tool.pixi.tasks]
dexter-relay-client = "python -m dexter_relay.client"
run-server = "python -m dexter_relay.server"
